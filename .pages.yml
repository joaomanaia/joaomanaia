media:
  input: website/public
  output: /

content:
  - name: projects
    label: Projects
    type: collection
    path: website/src/content/projects
    format: yaml-frontmatter
    subfolders: true

    filename:
      template: "{primary}.md"
      field: create

    operations:
      create: true
      delete: true
      rename: true

    view:
      primary: title
      sort: [createdAt, priority, title]
      search: [title, description, tags]
      default:
        sort: createdAt
        order: desc

    fields:
      - name: title
        label: Title
        type: string
        required: true

      - name: description
        label: Description
        type: text
        required: true

      - name: priority
        label: Priority
        type: number
        default: 0
        description: Higher priority floats to the top.
        options:
          min: 0

      - name: createdAt
        label: Created at
        type: date
        required: true

      - name: updatedAt
        label: Updated at
        type: date
        required: false

      - name: tags
        label: Tags
        type: string
        list: true
        required: false

      - name: featured
        label: Featured
        type: boolean
        default: true

      - name: related
        label: Related projects
        type: reference
        required: false
        options:
          collection: projects
          multiple: true
          search: "title,description,tags"
          value: "{path}"
          label: "{primary}"

      - name: links
        label: Links
        type: object
        list: true
        required: false
        fields:
          - name: name
            label: Name
            type: string
            required: true

          - name: url
            label: URL
            type: string
            required: true

          - name: variant
            label: Variant
            type: select
            required: false
            default: default
            options:
              values:
                - default
                - outline
                - secondary
                - ghost
                - destructive
                - link

  - name: timeline
    label: Timeline
    type: collection
    path: website/src/content/timeline
    format: yaml-frontmatter
    subfolders: true

    filename:
      template: "{primary}.md"
      field: create

    operations:
      create: true
      delete: true
      rename: true

    view:
      primary: title
      sort: [order, title]
      search: [title, subtitle, period, description]
      default:
        sort: order
        order: asc

    fields:
      - name: title
        label: Title
        type: string
        required: true

      - name: subtitle
        label: Subtitle
        type: string
        required: false

      - name: period
        label: Period
        type: string
        required: true

      - name: order
        label: Order
        type: number
        default: 0
        required: true
        options:
          min: 0

      - name: description
        label: Description
        type: text
        required: true

      - name: projects
        label: Projects
        type: reference
        required: false
        options:
          collection: projects
          multiple: true
          search: "title,description,tags"
          value: "{path}"
          label: "{primary}"
