worker_processes  1;

events {
  worker_connections  1024;
}

http {
    resolver 1.1.1.1 8.8.8.8 valid=30s;

    server {
        listen 80;
        server_name   _;

        root   /usr/share/nginx/html;
        index  index.html index.htm;
        include /etc/nginx/mime.types;

        gzip on;
        gzip_min_length 1000;
        gzip_proxied expired no-cache no-store private auth;
        gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;

        error_page 404 /404.html;
        # location = /404.html {
        #         root /usr/share/nginx/html;
        #         internal;
        # }

        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        # Umami Analytics - Reverse Proxy
        # This proxies the tracking script and API endpoint to bypass ad blockers
        location = /orange.js {
            set $umami_host ${UMAMI_HOST};
            proxy_ssl_server_name on;
            proxy_pass http://$umami_host/script.js;
            proxy_set_header Host umami.joaomanaia.dev;
            proxy_set_header X-Client-Real-IP $http_cf_connecting_ip;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
            proxy_set_header CF-IPCountry $http_cf_ipcountry;
            proxy_set_header CF-Region-Code $http_cf_region_code;
            proxy_set_header CF-IPCity $http_cf_ipcity;
        }

        location = /api/send {
            set $umami_host ${UMAMI_HOST};
            proxy_ssl_server_name on;
            proxy_pass http://$umami_host/api/send;
            proxy_set_header Host umami.joaomanaia.dev;
            proxy_set_header X-Client-Real-IP $http_cf_connecting_ip;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
            proxy_set_header CF-IPCountry $http_cf_ipcountry;
            proxy_set_header CF-Region-Code $http_cf_region_code;
            proxy_set_header CF-IPCity $http_cf_ipcity;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
