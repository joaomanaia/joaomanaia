worker_processes  1;

events {
  worker_connections  1024;
}

http {
  server {
    listen 80;
    server_name   _;

    root   /usr/share/nginx/html;
    index  index.html index.htm;
    include /etc/nginx/mime.types;

    gzip on;
    gzip_min_length 1000;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;

    error_page 404 /404.html;
    # location = /404.html {
    #         root /usr/share/nginx/html;
    #         internal;
    # }

    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # Umami Analytics - Reverse Proxy
    # This proxies the tracking script and API endpoint to bypass ad blockers
    location /orange.js {
      resolver 1.1.1.1 1.0.0.1 ipv6=off valid=300s;
      set $umami_host umami.joaomanaia.dev;
      proxy_pass https://$umami_host/script.js;
      proxy_set_header Host $umami_host;
      proxy_ssl_server_name on;
      proxy_ssl_name $umami_host;
      proxy_ssl_verify off;
      proxy_cache_valid 200 24h;
      add_header Cache-Control "public, max-age=86400";
    }

    location /api/send {
      resolver 1.1.1.1 1.0.0.1 ipv6=off valid=300s;
      set $umami_host umami.joaomanaia.dev;
      proxy_pass https://$umami_host/api/send;
      proxy_set_header Host $umami_host;
      proxy_ssl_server_name on;
      proxy_ssl_name $umami_host;
      proxy_ssl_verify off;
      proxy_method POST;
    }

    location / {
            try_files $uri $uri/index.html =404;
    }
  }
}
